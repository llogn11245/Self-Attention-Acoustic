optim:
  # type: sgd
  # lr: 0.0005
  # momentum: 0.9
  # weight_decay: 0
  # begin_to_adjust_lr: 60
  # nesterov: None
  # decay_rate: 0.5

  type: adam
  lr: 0.0003
  weight_decay: 0.0001
  decay_rate: 0.5

scheduler:
  lr_initial: 0.0003
  n_warmup_steps: 15000

loss:
  # type: cross_entropy 
  # blank: 4
  # reduction: mean
  # label_smoothing: 0.1

  type: kldiv 
  reduction: batchmean
  
  ctc_weight: 0.3
  ctc_reduction: mean