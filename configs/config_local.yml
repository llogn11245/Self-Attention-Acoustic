model:
  enc: 
    n_head: 8
    d_model: 80               
    d_hidden: 256       
    dropout: 0.2
    n_layer: 3
  dec: 
    embed_dim: 128
    d_hidden: 256
    num_layers: 2
    embed_dropout: 0.2
    var_dropout: 0.1
  vocab_size: 4866
  feature_dim: 80   # sync with dataset.py
  name : 'SAA'
  share_weight: False
  pad_id: 0
  sos_id: 1
  eos_id: 2
  blank_id: 0
  spec_augment: False
  mF: 2
  F: 15
  mT: 2
  pS: 0.05

# Vivos
training:
  epochs: 100
  batch_size: 1
  accumulation_steps: 1
  save_path: "C:/paper/self-acoustic/save_folder"
  train_path : "C:/paper/raw_data/Vietnamese-Speech-to-Text-datasets/ViVOS/train_w2i.json"
  dev_path : "C:/paper/raw_data/Vietnamese-Speech-to-Text-datasets/ViVOS/test_w2i.json"
  test_path : "C:/paper/raw_data/Vietnamese-Speech-to-Text-datasets/ViVOS/test_w2i.json"
  vocab_path : "C:/paper/raw_data/Vietnamese-Speech-to-Text-datasets/ViVOS/vocab_w2i.json"
  cmvn_stats : "workspace/rna/conv-rnnt/data/cmvn_stats.pt"
  log_path: "C:/paper/self-acoustic/logs"
  reload: False

